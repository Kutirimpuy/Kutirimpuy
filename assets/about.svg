<text x="28" y="78" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA3C0">Soy estudiante de Ingeniería Mecatrónica con gran pasión por la robótica,</text><text x="28" y="100" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA3C0">la automatización y la innovación tecnológica. Siempre estoy buscando</text><text x="28" y="122" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA3C0">nuevas tecnologías y desafíos que me permitan seguir aprendiendo y</text><text x="28" y="144" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8FA3C0">creciendo en mi campo.</text>
